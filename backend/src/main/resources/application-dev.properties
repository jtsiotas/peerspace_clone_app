# Database settings
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:peerspace_clone}
spring.datasource.username=${POSTGRES_USER:peerspace_app}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# disable first time to generate create tables
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.security.secret-key=${JWT_SECRET_KEY:default_insecure_development_jwt_secret_key_change_me_in_production_at_least_32_characters}
app.security.jwt-expiration=10800000

# make sure to use JOIN FETCH
spring.jpa.open-in-view=false

allowed.origins=http://localhost:5173,http://localhost:3000,https://coding-factory.apps.gov.gr
# file.upload.dir=uploads/

# sping.servlet.multipart.max-file-size=5MB
# server port config
server.port=8082
